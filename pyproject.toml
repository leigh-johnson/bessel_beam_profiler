[project]
name = "bessel-axicon-simulator"
version = "0.1.0"
description = ""
authors = [{ name = "Leigh Zaman", email = "leighzaman@berkeley.edu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy (>=2.4.6,<3.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "streamlit (>=1.58.0,<2.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["watchdog (>=6.0.0,<7.0.0)"]

[tool.poetry]
package-mode = false
